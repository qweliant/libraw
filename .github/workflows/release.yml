name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create the release under (e.g. v0.3.0-rc1)"
        required: true
        type: string

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15", "2.16", "2.17"]
        # The runner choice bakes a libraw soname into the artifact: whatever
        # `apt install libraw-dev` / `brew install libraw` provides becomes a
        # hard DT_NEEDED. Both Linux runners MUST ship the same libraw ABI, or
        # half the Linux userbase gets a NIF that cannot dlopen. ubuntu-24.04
        # and ubuntu-24.04-arm both provide libraw 0.21 (libraw.so.23);
        # ubuntu-22.04 provides libraw 0.20 (libraw.so.20) and must not be
        # paired with the 24.04 ARM runner. Verify with `readelf -d` on the
        # artifacts after changing a runner label.
        job:
          - { target: aarch64-apple-darwin,      os: macos-latest     }
          - { target: x86_64-apple-darwin,       os: macos-15-intel   }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-24.04     }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }

    steps:
      - uses: actions/checkout@v4

      # rustler-precompiled-action prepends "v" itself, and RustlerPrecompiled
      # downloads by the mix.exs version — so pass the bare version, never the
      # tag name (which would break on rc tags like v0.3.0-rc1).
      - name: Extract project version
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

      - name: Install libraw (macOS)
        if: runner.os == 'macOS'
        run: brew install libraw

      - name: Install libraw (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libraw-dev

      - name: Build precompiled NIF
        id: build
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: libraw_nif
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          project-dir: "native/libraw_nif"
          # All four targets build on native runners. Must be the empty string,
          # not false: the action's `if: inputs.use-cross` sees the string
          # "false", which is truthy, and its cross-install helper breaks on
          # macOS (BSD tar lacks --wildcards). Empty is falsy and skips it.
          use-cross: ""

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.file-name }}
          path: ${{ steps.build.outputs.file-path }}

  release:
    name: Publish GitHub Release
    # Branch pushes only validate the build matrix — never publish a release.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build_release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate sha256 checksum files
        run: |
          cd artifacts
          for f in *.tar.gz; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create GitHub Release
        # v1 runs on the deprecated node16 runtime; v3 is the current major and
        # takes the same inputs. Unlike rustler-precompiled-action this one does
        # publish a moving major tag, so no exact pin is needed.
        uses: softprops/action-gh-release@v3
        with:
          # On tag pushes github.ref_name is the tag; on workflow_dispatch the
          # release (and tag, if missing) is created from the input at this SHA.
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          # Any semver prerelease tag (v0.3.0-rc1, v1.0.0-beta.1) carries a
          # hyphen; stable tags never do. Without this an RC would be shown as
          # "Latest release" on the repo page.
          prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/**
