[package]
name = "libraw_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "libraw_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"

# rustler-precompiled-action selects the target NIF version by activating
# one of these features; each must forward to the matching rustler feature.
[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
nif_version_2_17 = ["rustler/nif_version_2_17"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"
